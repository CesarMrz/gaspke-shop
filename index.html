<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GaspKe Shop • Panel Completo</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --pink: #ffb6d9;
  --pink-dark: #ff8ec7;
  --lavender: #c9b6ff;
  --lavender-dark: #a78bfa;
  --bg: #fff5fb;
  --text: #5a4a6a;
  --text-dim: #8a7a9a;
  --accent: #ff6b9d;
  --green: #6ee7b7;
  --shadow: 0 8px 30px rgba(255, 182, 217, 0.25);
  --card: #ffffff;
  --border: #f0d0e8;
}
[data-theme="dark"] {
  --bg: #1a1220;
  --text: #f0e6f5;
  --text-dim: #c9b8d4;
  --accent: #ff8ec7;
  --card: #2a1f35;
  --border: #3d2f4a;
  --shadow: 0 8px 30px rgba(0,0,0,0.4);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Nunito', 'Quicksand', system-ui, sans-serif;
  background: linear-gradient(135deg, var(--bg) 0%, #f3e8ff 50%, #ffe6f2 100%);
  color: var(--text);
  min-height: 100vh;
}
[data-theme="dark"] body { background: linear-gradient(135deg, #1a1220 0%, #2a1f35 50%, #1f1528 100%); }
.sidebar {
  position: fixed; left: 0; top: 0; bottom: 0; width: 270px;
  background: linear-gradient(180deg, #fff0f7, #f8f0ff);
  border-right: 1px solid var(--border);
  padding: 20px 14px; display: flex; flex-direction: column; z-index: 100;
  box-shadow: 4px 0 20px rgba(255,182,217,0.15); overflow-y: auto;
}
[data-theme="dark"] .sidebar { background: linear-gradient(180deg, #2a1f35, #1f1528); }
.logo { text-align: center; margin-bottom: 18px; }
.logo img { width: 100%; max-width: 160px; border-radius: 18px; box-shadow: var(--shadow); margin-bottom: 8px; }
.logo-text { font-weight: 800; font-size: 20px; color: var(--accent); }
.logo-sub { font-size: 11px; color: var(--text-dim); }
.nav-item {
  display: flex; align-items: center; gap: 10px; padding: 11px 14px; border-radius: 14px;
  color: var(--text-dim); cursor: pointer; margin-bottom: 4px; transition: 0.2s; font-weight: 700; font-size: 14.5px;
}
.nav-item:hover, .nav-item.active { background: var(--card); color: var(--accent); box-shadow: 0 4px 16px rgba(255,107,157,0.15); }
.nav-item.active { border-left: 4px solid var(--accent); }
.cart-badge { background: var(--accent); color: white; font-size: 11px; font-weight: 800; padding: 2px 7px; border-radius: 10px; margin-left: auto; }
.theme-toggle { margin-top: 10px; padding: 9px; text-align: center; cursor: pointer; border-radius: 12px; background: var(--card); font-weight: 700; font-size: 13px; border: 1px solid var(--border); }
.main { margin-left: 270px; padding: 26px 32px; }
.header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 22px; flex-wrap: wrap; gap: 12px; }
.header h1 { font-size: 28px; font-weight: 800; }
.balance-box { background: var(--card); border-radius: 18px; padding: 10px 18px; display: flex; align-items: center; gap: 12px; box-shadow: var(--shadow); }
.balance-box .amount { font-size: 20px; font-weight: 800; color: #10b981; }
.btn { background: linear-gradient(135deg, var(--accent), #ff8ec7); color: white; border: none; padding: 10px 16px; border-radius: 12px; font-weight: 700; cursor: pointer; font-size: 14px; transition: 0.2s; }
.btn:hover { transform: translateY(-2px); }
.btn-secondary { background: #f3e8ff; color: var(--lavender-dark); }
[data-theme="dark"] .btn-secondary { background: #3d2f4a; color: #c9b6ff; }
.btn-green { background: linear-gradient(135deg, #34d399, #6ee7b7); color: #065f46; }
.btn-sm { padding: 6px 11px; font-size: 13px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; margin-bottom: 24px; }
.stat-card { background: var(--card); border-radius: 18px; padding: 18px; box-shadow: var(--shadow); }
.stat-card .label { color: var(--text-dim); font-size: 12.5px; font-weight: 600; }
.stat-card .value { font-size: 26px; font-weight: 800; margin-top: 4px; color: var(--accent); }
.platforms { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
.platform-card { background: var(--card); border-radius: 18px; padding: 16px; display: flex; align-items: center; gap: 12px; box-shadow: var(--shadow); transition: 0.2s; position: relative; }
.platform-card:hover { transform: translateY(-3px); }
.platform-icon { width: 52px; height: 52px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 18px; color: white; flex-shrink: 0; }
.platform-info h3 { font-size: 16px; font-weight: 800; }
.platform-info .price { color: var(--text-dim); font-size: 13px; }
.platform-info .stock { font-size: 12px; font-weight: 700; margin-top: 2px; }
.stock-low { color: #ef4444; }
.stock-ok { color: #10b981; }
.low-badge { position: absolute; top: 6px; right: 6px; background: #ef4444; color: white; font-size: 9px; padding: 2px 5px; border-radius: 6px; font-weight: 800; }
.accounts-table { background: var(--card); border-radius: 18px; overflow: hidden; box-shadow: var(--shadow); }
table { width: 100%; border-collapse: collapse; }
th, td { padding: 12px 14px; text-align: left; }
th { background: #fff0f7; color: var(--text-dim); font-size: 11.5px; font-weight: 700; text-transform: uppercase; }
[data-theme="dark"] th { background: #3d2f4a; }
td { border-top: 1px solid var(--border); font-size: 13.5px; }
.status-active { color: #10b981; font-weight: 700; }
.status-expired { color: #ef4444; font-weight: 700; }
.toast { position: fixed; bottom: 20px; right: 20px; background: var(--card); padding: 12px 18px; border-radius: 14px; z-index: 2000; box-shadow: 0 8px 30px rgba(0,0,0,0.15); animation: slideIn 0.3s; max-width: 320px; border-left: 4px solid var(--accent); }
@keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
.cart-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border); }
.cart-total { font-size: 18px; font-weight: 800; margin: 14px 0; display: flex; justify-content: space-between; color: var(--accent); }
.copy-btn { background: #f3e8ff; border: none; color: var(--lavender-dark); padding: 5px 10px; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: 700; }
[data-theme="dark"] .copy-btn { background: #3d2f4a; color: #c9b6ff; }
.empty { text-align: center; color: var(--text-dim); padding: 40px; font-size: 15px; }
.search-bar { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
.search-input, .sort-select, input, select { padding: 8px 12px; border: 2px solid var(--border); border-radius: 12px; background: var(--card); color: var(--text); font-weight: 600; }
.search-input { flex: 1; min-width: 180px; }
.qty-controls { display: flex; align-items: center; gap: 5px; }
.qty-btn { width: 26px; height: 26px; border-radius: 7px; border: none; background: #f3e8ff; cursor: pointer; font-weight: 800; color: var(--accent); }
[data-theme="dark"] .qty-btn { background: #3d2f4a; }
.recharge-options { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 14px 0; }
.recharge-opt { background: var(--card); border: 2px solid var(--border); border-radius: 14px; padding: 14px; text-align: center; cursor: pointer; }
.recharge-opt:hover, .recharge-opt.selected { border-color: var(--accent); background: #fff0f7; }
[data-theme="dark"] .recharge-opt:hover, [data-theme="dark"] .recharge-opt.selected { background: #3d2f4a; }
.recharge-opt .amt { font-size: 17px; font-weight: 800; color: var(--accent); }
.section-title { font-size: 18px; font-weight: 800; margin-bottom: 14px; }
.admin-login { max-width: 400px; margin: 30px auto; background: var(--card); padding: 30px; border-radius: 20px; box-shadow: var(--shadow); text-align: center; }
.footer-note { margin-top: auto; padding: 12px; color: var(--text-dim); font-size: 11px; text-align: center; }
.fav-btn { background: none; border: none; font-size: 18px; cursor: pointer; }
@media (max-width: 900px) {
  .sidebar { width: 70px; padding: 10px 6px; }
  .logo img, .logo-text, .logo-sub, .nav-item span:not(.cart-badge), .theme-toggle span { display: none; }
  .theme-toggle { font-size: 16px; }
  .main { margin-left: 70px; padding: 14px; }
  .platforms { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="sidebar">
  <div class="logo">
    <img src="brand-logo.png" alt="GaspKe Shop">
    <div class="logo-text">GaspKe Shop</div>
    <div class="logo-sub">Panel Completo</div>
  </div>
  <div class="nav-item active" onclick="showSection('dashboard', this)">✨ <span>Dashboard</span></div>
  <div class="nav-item" onclick="showSection('store', this)">🛍️ <span>Tienda</span></div>
  <div class="nav-item" onclick="showSection('cart', this)">🎀 <span>Carrito</span> <span class="cart-badge" id="cart-count">0</span></div>
  <div class="nav-item" onclick="showSection('accounts', this)">🔑 <span>Mis Cuentas</span></div>
  <div class="nav-item" onclick="showSection('orders', this)">📦 <span>Pedidos</span></div>
  <div class="nav-item" onclick="showSection('favorites', this)">💖 <span>Favoritos</span></div>
  <div class="nav-item" onclick="showSection('wallet', this)">💰 <span>Saldo</span></div>
  <div class="nav-item" onclick="showSection('admin', this)">⚙️ <span>Admin</span></div>
  <div class="theme-toggle" onclick="toggleTheme()">🌙 <span>Modo Oscuro</span></div>
  <div class="footer-note">GaspKe Shop ♡</div>
</div>
<div class="main" id="content"></div>

<script>
const defaultPlatforms = [
  { id: 'netflix', name: "Netflix", icon: "N", color: "#e50914", price: 3.50, stock: 47, category: "Streaming" },
  { id: 'disney', name: "Disney+", icon: "D", color: "#113ccf", price: 2.80, stock: 32, category: "Streaming" },
  { id: 'max', name: "Max / HBO", icon: "M", color: "#7b2cbf", price: 2.50, stock: 28, category: "Streaming" },
  { id: 'prime', name: "Amazon Prime", icon: "A", color: "#00a8e1", price: 2.20, stock: 19, category: "Streaming" },
  { id: 'spotify', name: "Spotify", icon: "S", color: "#1db954", price: 1.80, stock: 61, category: "Música" },
  { id: 'yt', name: "YouTube Premium", icon: "Y", color: "#ff0000", price: 2.00, stock: 24, category: "Streaming" },
  { id: 'paramount', name: "Paramount+", icon: "P", color: "#0064ff", price: 1.90, stock: 15, category: "Streaming" },
  { id: 'crunchy', name: "Crunchyroll", icon: "C", color: "#f47521", price: 1.50, stock: 38, category: "Anime" },
  { id: 'apple', name: "Apple TV+", icon: "A", color: "#000000", price: 2.10, stock: 12, category: "Streaming" },
  { id: 'hulu', name: "Hulu", icon: "H", color: "#1ce783", price: 2.40, stock: 18, category: "Streaming" },
  { id: 'peacock', name: "Peacock", icon: "P", color: "#000000", price: 1.70, stock: 22, category: "Streaming" },
  { id: 'discovery', name: "Discovery+", icon: "D", color: "#0073e6", price: 1.60, stock: 14, category: "Streaming" },
  { id: 'star', name: "Star+", icon: "S", color: "#ffd100", price: 2.30, stock: 27, category: "Streaming" },
  { id: 'vix', name: "Vix", icon: "V", color: "#ff3b30", price: 1.20, stock: 45, category: "Streaming" },
  { id: 'magis', name: "Magis TV", icon: "M", color: "#ff6b00", price: 1.40, stock: 33, category: "TV" },
  { id: 'iptv', name: "IPTV Premium", icon: "I", color: "#8b5cf6", price: 4.50, stock: 50, category: "TV" },
  { id: 'canva', name: "Canva Pro", icon: "C", color: "#00c4cc", price: 1.90, stock: 40, category: "Herramientas" },
  { id: 'chatgpt', name: "ChatGPT Plus", icon: "G", color: "#10a37f", price: 5.00, stock: 25, category: "IA" },
  { id: 'capcut', name: "CapCut Pro", icon: "C", color: "#000000", price: 1.50, stock: 30, category: "Herramientas" },
  { id: 'deezer', name: "Deezer", icon: "D", color: "#ff0090", price: 1.60, stock: 20, category: "Música" },
  { id: 'tidal', name: "Tidal", icon: "T", color: "#000000", price: 2.20, stock: 16, category: "Música" },
  { id: 'dazn', name: "DAZN", icon: "D", color: "#ffd200", price: 3.80, stock: 12, category: "Deportes" },
  { id: 'espn', name: "ESPN+", icon: "E", color: "#cc0000", price: 2.90, stock: 18, category: "Deportes" },
  { id: 'mubi', name: "MUBI", icon: "M", color: "#000000", price: 2.50, stock: 10, category: "Cine" },
  { id: 'crunchy_premium', name: "Crunchyroll Mega Fan", icon: "C", color: "#f47521", price: 2.80, stock: 15, category: "Anime" },
  { id: 'hbo_max', name: "Max Platino", icon: "M", color: "#7b2cbf", price: 3.20, stock: 20, category: "Streaming" },
  { id: 'netflix_4k', name: "Netflix 4K", icon: "N", color: "#e50914", price: 4.50, stock: 35, category: "Streaming" },
  { id: 'disney_premium', name: "Disney+ Premium", icon: "D", color: "#113ccf", price: 3.50, stock: 28, category: "Streaming" },
  { id: 'prime_video', name: "Prime Video", icon: "P", color: "#00a8e1", price: 2.00, stock: 22, category: "Streaming" },
  { id: 'youtube_music', name: "YouTube Music", icon: "Y", color: "#ff0000", price: 1.70, stock: 19, category: "Música" }
];

let platforms = JSON.parse(JSON.stringify(defaultPlatforms));
let state = { balance: 50, cart: [], accounts: [], sales: [], favorites: [], theme: 'light', user: null, token: null };
let authMode = 'login';
let adminUnlocked = false;
const ADMIN_CODE = "gaspke2026";
let searchTerm = '';
let sortBy = 'name';
let categoryFilter = 'Todas';

function loadState() {
  const token = localStorage.getItem('gaspke-token');
  const user = localStorage.getItem('gaspke-user');
  if (token && user) {
    state.token = token;
    state.user = JSON.parse(user);
    state.balance = state.user.balance || 50;
  }
  const saved = localStorage.getItem('gaspke-completo');
  if (saved) {
    const data = JSON.parse(saved);
    state = { ...state, ...data.state };
    if (data.platforms) platforms = data.platforms;
  }
  if (state.theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
  updateCartCount();
  updateThemeToggle();
}
function saveState() {
  localStorage.setItem('gaspke-completo', JSON.stringify({ state, platforms }));
  updateCartCount();
}
function updateCartCount() {
  const el = document.getElementById('cart-count');
  if (el) el.textContent = state.cart.reduce((s, i) => s + i.qty, 0);
}
function showToast(msg) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2600);
}
function toggleTheme() {
  state.theme = state.theme === 'dark' ? 'light' : 'dark';
  if (state.theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
  else document.documentElement.removeAttribute('data-theme');
  saveState();
  updateThemeToggle();
  showToast(state.theme === 'dark' ? 'Modo oscuro 🌙' : 'Modo claro ☀️');
}
function updateThemeToggle() {
  const el = document.querySelector('.theme-toggle');
  if (el) el.innerHTML = state.theme === 'dark' ? '☀️ <span>Modo Claro</span>' : '🌙 <span>Modo Oscuro</span>';
}
function getCategories() {
  const cats = ['Todas', ...new Set(platforms.map(p => p.category || 'Otro'))];
  return cats;
}
function filteredPlatforms() {
  let list = platforms.filter(p => 
    p.name.toLowerCase().includes(searchTerm.toLowerCase()) &&
    (categoryFilter === 'Todas' || p.category === categoryFilter)
  );
  if (sortBy === 'price') list.sort((a,b) => a.price - b.price);
  else if (sortBy === 'price-desc') list.sort((a,b) => b.price - a.price);
  else if (sortBy === 'stock') list.sort((a,b) => b.stock - a.stock);
  else list.sort((a,b) => a.name.localeCompare(b.name));
  return list;
}
function isFav(id) { return state.favorites.includes(id); }
function toggleFav(id) {
  if (isFav(id)) state.favorites = state.favorites.filter(x => x !== id);
  else state.favorites.push(id);
  saveState();
  showToast(isFav(id) ? 'Agregado a favoritos ♡' : 'Quitado de favoritos');
  showSection(document.querySelector('.nav-item.active')?.onclick ? 'store' : 'store'); // refresh current if needed
}
function showSection(section, el) {
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  if (el) el.classList.add('active');
  const content = document.getElementById('content');

  if (section === 'dashboard') {
    const recent = state.sales.slice(-3).reverse();
    updateGreeting();
    content.innerHTML = `
      <div class="header">
        <div><h1 id="greeting">¡Hola! ✨</h1><p style="color:var(--text-dim);margin-top:4px">Bienvenida a GaspKe Shop</p></div>
        <div class="balance-box"><div><div style="font-size:11px;color:var(--text-dim)">Saldo</div><div class="amount">$${state.balance.toFixed(2)}</div></div>
        <button class="btn btn-green" onclick="showSection('wallet')">Recargar</button></div>
      </div>
      <div class="stats">
        <div class="stat-card"><div class="label">Cuentas</div><div class="value">${state.accounts.length}</div></div>
        <div class="stat-card"><div class="label">En carrito</div><div class="value">${state.cart.reduce((s,i)=>s+i.qty,0)}</div></div>
        <div class="stat-card"><div class="label">Gastado</div><div class="value">$${state.sales.reduce((s,x)=>s+x.total,0).toFixed(2)}</div></div>
        <div class="stat-card"><div class="label">Favoritos</div><div class="value">${state.favorites.length}</div></div>
      </div>
      <div class="section-title">Destacados 🎀</div>
      <div class="platforms">${platforms.slice(0,4).map(p => renderPlatformCard(p, true)).join('')}</div>
      <div style="text-align:center;margin-top:16px"><button class="btn" onclick="showSection('store', document.querySelectorAll('.nav-item')[1])">Ver tienda completa</button></div>
    `;
  }
  else if (section === 'store') {
    content.innerHTML = `
      <div class="header"><h1>Tienda 🛍️</h1><div class="balance-box"><div class="amount">$${state.balance.toFixed(2)}</div></div></div>
      <div class="search-bar">
        <input class="search-input" placeholder="Buscar..." value="${searchTerm}" oninput="searchTerm=this.value; showSection('store')">
        <select class="sort-select" onchange="sortBy=this.value; showSection('store')">
          <option value="name">Nombre</option><option value="price">Precio ↑</option><option value="price-desc">Precio ↓</option><option value="stock">Stock</option>
        </select>
        <select class="sort-select" onchange="categoryFilter=this.value; showSection('store')">
          ${getCategories().map(c => `<option ${c===categoryFilter?'selected':''}>${c}</option>`).join('')}
        </select>
      </div>
      <div class="platforms">${filteredPlatforms().map(p => renderPlatformCard(p)).join('') || '<div class="empty">Sin resultados</div>'}</div>
    `;
  }
  else if (section === 'cart') {
    const total = state.cart.reduce((s, i) => s + i.price * i.qty * i.months, 0);
    content.innerHTML = `
      <div class="header"><h1>Carrito 🎀</h1></div>
      ${state.cart.length === 0 ? '<div class="empty">Carrito vacío ♡</div>' : `
        <div class="accounts-table" style="padding:16px">
          ${state.cart.map((item, idx) => `
            <div class="cart-item">
              <div><strong>${item.name}</strong><div style="color:var(--text-dim);font-size:12px">${item.months} mes(es)</div></div>
              <div style="display:flex;align-items:center;gap:8px">
                <div class="qty-controls"><button class="qty-btn" onclick="changeCartQty(${idx},-1)">−</button><span style="font-weight:800;min-width:18px;text-align:center">${item.qty}</span><button class="qty-btn" onclick="changeCartQty(${idx},1)">+</button></div>
                <strong>$${(item.price*item.qty*item.months).toFixed(2)}</strong>
                <button class="copy-btn" onclick="removeFromCart(${idx})">Eliminar</button>
              </div>
            </div>`).join('')}
          <div class="cart-total"><span>Total</span><span>$${total.toFixed(2)}</span></div>
          <button class="btn" style="width:100%" onclick="checkout()" ${total>state.balance?'disabled style="opacity:.5"':''}>${total>state.balance?'Saldo insuficiente':'Comprar ♡'}</button>
          <button class="btn-secondary btn" style="width:100%;margin-top:8px" onclick="clearCart()">Vaciar</button>
        </div>`}
    `;
  }
  else if (section === 'accounts') {
    content.innerHTML = `
      <div class="header"><h1>Mis Cuentas 🔑</h1><button class="btn btn-sm" onclick="exportAccounts()">Exportar CSV</button></div>
      ${state.accounts.length === 0 ? '<div class="empty">Aún no tienes cuentas</div>' : `
        <div class="accounts-table"><table>
          <thead><tr><th>Plataforma</th><th>Email</th><th>Contraseña</th><th>PIN</th><th>Vence</th><th>Estado</th><th></th></tr></thead>
          <tbody>${state.accounts.map(a => `
            <tr><td><strong>${a.platform}</strong></td><td>${a.email}</td><td style="font-family:monospace">${a.pass}</td><td>${a.pin}</td><td>${a.expires}</td>
            <td class="${isActive(a)?'status-active':'status-expired'}">${isActive(a)?'Activa':'Vencida'}</td>
            <td><button class="copy-btn" onclick="copyText('${a.email}\\n${a.pass}')">Copiar</button></td></tr>`).join('')}
          </tbody></table></div>`}
    `;
  }
  else if (section === 'orders') {
    content.innerHTML = `
      <div class="header"><h1>Pedidos 📦</h1></div>
      ${state.sales.length === 0 ? '<div class="empty">Sin pedidos aún</div>' : `
        <div class="accounts-table"><table>
          <thead><tr><th>Fecha</th><th>Total</th><th>Items</th></tr></thead>
          <tbody>${state.sales.slice().reverse().map(s => `<tr><td>${new Date(s.date).toLocaleString('es')}</td><td>$${s.total.toFixed(2)}</td><td>${s.items}</td></tr>`).join('')}
          </tbody></table></div>`}
    `;
  }
  else if (section === 'favorites') {
    const favs = platforms.filter(p => state.favorites.includes(p.id));
    content.innerHTML = `
      <div class="header"><h1>Favoritos 💖</h1></div>
      ${favs.length === 0 ? '<div class="empty">No tienes favoritos aún</div>' : `<div class="platforms">${favs.map(p => renderPlatformCard(p)).join('')}</div>`}
    `;
  }
  else if (section === 'wallet') {
    content.innerHTML = `
      <div class="header"><h1>Saldo 💰</h1><div class="balance-box"><div class="amount">$${state.balance.toFixed(2)}</div></div></div>
      <div class="stat-card" style="max-width:480px">
        <div class="section-title">Recargar</div>
        <div class="recharge-options">
          ${[10,25,50,100,200,500].map(a => `<div class="recharge-opt" onclick="selectRecharge(${a},this)"><div class="amt">$${a}</div></div>`).join('')}
        </div>
        <button class="btn btn-green" style="width:100%" onclick="doRecharge()">Recargar ahora</button>
      </div>
    `;
  }
  else if (section === 'admin') {
    if (!adminUnlocked) {
      content.innerHTML = `
        <div class="admin-login">
          <h1>⚙️ Admin</h1>
          <input type="password" id="admin-code" placeholder="Código" onkeydown="if(event.key==='Enter')checkAdmin()" style="width:100%;margin:12px 0;padding:12px;border-radius:12px;border:2px solid var(--border)">
          <button class="btn" style="width:100%" onclick="checkAdmin()">Entrar</button>
          <p style="font-size:12px;color:var(--text-dim);margin-top:12px">Código: gaspke2026</p>
        </div>`;
    } else {
      content.innerHTML = `
        <div class="header"><h1>Administración</h1><button class="btn-secondary btn" onclick="adminUnlocked=false;showSection('admin')">Cerrar</button></div>
        <div class="accounts-table"><table>
          <thead><tr><th>Plataforma</th><th>Precio</th><th>Stock</th><th></th></tr></thead>
          <tbody>${platforms.map((p,i)=>`<tr>
            <td>${p.name}</td>
            <td><input type="number" step="0.1" value="${p.price.toFixed(2)}" id="price-${i}" style="width:80px"></td>
            <td><input type="number" value="${p.stock}" id="stock-${i}" style="width:70px"></td>
            <td><button class="copy-btn" onclick="deletePlatform(${i})">Eliminar</button></td>
          </tr>`).join('')}
          </tbody></table></div>
        <div style="margin-top:16px;display:flex;gap:10px;flex-wrap:wrap">
          <button class="btn btn-green" onclick="saveAdmin()">Guardar</button>
          <button class="btn-secondary btn" onclick="resetPlatforms()">Restaurar</button>
          <button class="btn" onclick="document.getElementById('add-form').style.display='block'">+ Nueva</button>
        </div>
        <div id="add-form" style="display:none;margin-top:16px;background:var(--card);padding:16px;border-radius:14px;max-width:400px">
          <input id="new-name" placeholder="Nombre" style="width:100%;margin-bottom:8px;padding:8px;border-radius:8px;border:2px solid var(--border)">
          <input id="new-price" type="number" step="0.1" placeholder="Precio" style="width:100%;margin-bottom:8px;padding:8px;border-radius:8px;border:2px solid var(--border)">
          <input id="new-stock" type="number" placeholder="Stock" style="width:100%;margin-bottom:8px;padding:8px;border-radius:8px;border:2px solid var(--border)">
          <button class="btn" onclick="addPlatform()">Agregar</button>
        </div>`;
    }
  }
}
function renderPlatformCard(p, simple=false) {
  const stockClass = p.stock < 5 ? 'stock-low' : 'stock-ok';
  const low = p.stock < 5 ? '<div class="low-badge">Poco stock</div>' : '';
  const fav = `<button class="fav-btn" onclick="toggleFav('${p.id}')">${isFav(p.id)?'💖':'🤍'}</button>`;
  const controls = simple ? `<button class="btn btn-sm" style="margin-left:auto" onclick="addToCart('${p.id}',1)">Agregar</button>` : `
    <div style="margin-left:auto;display:flex;flex-direction:column;gap:6px;align-items:flex-end">
      <select id="dur-${p.id}" style="padding:4px 8px;border-radius:8px;border:2px solid var(--border);background:var(--card);color:var(--text)"><option value="1">1 mes</option><option value="3">3 meses</option><option value="6">6 meses</option><option value="12">12 meses</option></select>
      <div class="qty-controls"><button class="qty-btn" onclick="changeTempQty('${p.id}',-1)">−</button><span id="qty-${p.id}" style="font-weight:800">1</span><button class="qty-btn" onclick="changeTempQty('${p.id}',1)">+</button></div>
      <button class="btn btn-sm" onclick="addToCart('${p.id}')">Agregar ♡</button>
    </div>`;
  return `<div class="platform-card">${low}<div class="platform-icon" style="background:${p.color}">${p.icon}</div>
    <div class="platform-info"><h3>${p.name} ${fav}</h3><div class="price">$${p.price.toFixed(2)} / mes</div><div class="stock ${stockClass}">${p.stock} stock</div></div>${controls}</div>`;
}
function isActive(acc) {
  if (!acc.expires) return true;
  const [d,m,y] = acc.expires.split('/');
  return new Date(y, m-1, d) >= new Date();
}
function changeTempQty(id, d) {
  const el = document.getElementById('qty-'+id);
  if (el) { let q = Math.max(1, parseInt(el.textContent)+d); el.textContent = q; }
}
function changeCartQty(idx, d) {
  state.cart[idx].qty += d;
  if (state.cart[idx].qty < 1) state.cart.splice(idx,1);
  saveState(); showSection('cart');
}
function clearCart() { if(confirm('¿Vaciar carrito?')) { state.cart=[]; saveState(); showSection('cart'); } }
function addToCart(id, force) {
  const p = platforms.find(x=>x.id===id);
  if (!p || p.stock<=0) return showToast('Sin stock');
  const months = parseInt(document.getElementById('dur-'+id)?.value||1);
  const qty = force || parseInt(document.getElementById('qty-'+id)?.textContent||1);
  if (qty > p.stock) return showToast('Stock insuficiente');
  const ex = state.cart.find(i=>i.id===id && i.months===months);
  if (ex) ex.qty += qty; else state.cart.push({id, name:p.name, price:p.price, months, qty});
  saveState(); showToast(p.name+' agregado ♡');
}
function removeFromCart(idx) { state.cart.splice(idx,1); saveState(); showSection('cart'); }
function checkout() {
  if (!state.token) { showAuth(); return showToast('Debes iniciar sesión para comprar'); }
  const total = state.cart.reduce((s,i)=>s+i.price*i.qty*i.months,0);
  if (total > state.balance) return showToast('Saldo insuficiente');
  if (!confirm('¿Confirmar compra por $'+total.toFixed(2)+'?')) return;
  state.balance -= total;
  const now = new Date();
  state.cart.forEach(item => {
    const plat = platforms.find(p=>p.id===item.id);
    if (plat) plat.stock = Math.max(0, plat.stock - item.qty);
    for (let q=0; q<item.qty; q++) {
      const exp = new Date(now); exp.setMonth(exp.getMonth()+item.months);
      state.accounts.push({
        platform: item.name,
        email: `user${Math.floor(Math.random()*9000+1000)}@gaspke.shop`,
        pass: 'Pass'+Math.random().toString(36).slice(2,8)+'!',
        pin: Math.floor(1000+Math.random()*9000).toString(),
        expires: exp.toLocaleDateString('es'),
        bought: now.toLocaleDateString('es')
      });
    }
  });
  state.sales.push({ date: now.toISOString(), total, items: state.cart.reduce((s,i)=>s+i.qty,0) });
  state.cart = [];
  saveState();
  showToast('¡Compra exitosa! ♡');
  showSection('accounts');
}
function copyText(t) { navigator.clipboard.writeText(t.replace(/\\n/g,'\n')); showToast('Copiado'); }
function exportAccounts() {
  if (!state.accounts.length) return showToast('Sin cuentas');
  const csv = 'Plataforma,Email,Password,PIN,Vence\n' + state.accounts.map(a=>`"${a.platform}","${a.email}","${a.pass}","${a.pin}","${a.expires}"`).join('\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download='cuentas.csv'; a.click();
}
function checkAdmin() {
  if (document.getElementById('admin-code').value.trim() === ADMIN_CODE) { adminUnlocked=true; showToast('Acceso concedido'); showSection('admin'); }
  else showToast('Código incorrecto');
}
function saveAdmin() {
  platforms.forEach((p,i) => {
    const price = parseFloat(document.getElementById('price-'+i).value);
    const stock = parseInt(document.getElementById('stock-'+i).value);
    if (!isNaN(price)) p.price = price;
    if (!isNaN(stock)) p.stock = stock;
  });
  saveState(); showToast('Guardado');
}
function resetPlatforms() {
  if (confirm('¿Restaurar valores originales?')) { platforms = JSON.parse(JSON.stringify(defaultPlatforms)); saveState(); showToast('Restaurado'); showSection('admin'); }
}
function deletePlatform(i) { if(confirm('¿Eliminar?')) { platforms.splice(i,1); saveState(); showSection('admin'); } }
function addPlatform() {
  const name = document.getElementById('new-name').value.trim();
  const price = parseFloat(document.getElementById('new-price').value);
  const stock = parseInt(document.getElementById('new-stock').value);
  if (!name || isNaN(price) || isNaN(stock)) return showToast('Completa los campos');
  platforms.push({ id: name.toLowerCase().replace(/\W/g,'')+Date.now().toString().slice(-4), name, icon: name[0], color: '#ff6b9d', price, stock, category: 'Otro' });
  saveState(); showToast('Agregada'); showSection('admin');
}
let selectedRecharge = 0;
function selectRecharge(amt, el) { selectedRecharge=amt; document.querySelectorAll('.recharge-opt').forEach(o=>o.classList.remove('selected')); el.classList.add('selected'); }
function doRecharge() {
  if (selectedRecharge<=0) return showToast('Selecciona monto');
  state.balance += selectedRecharge; saveState(); showToast('+$'+selectedRecharge+' ♡'); showSection('wallet');
}

loadState();
showSection('dashboard', document.querySelector('.nav-item'));

function getGreeting() {
  const h = new Date().getHours();
  if (h < 12) return 'Buenos días';
  if (h < 19) return 'Buenas tardes';
  return 'Buenas noches';
}
function updateGreeting() {
  const el = document.getElementById('greeting');
  if (!el) return;
  const name = state.user ? state.user.name : '';
  el.textContent = name ? `${getGreeting()}, ${name} ✨` : '¡Hola! ✨';
}
function showAuth(force=false) {
  document.getElementById('auth-modal').style.display = 'flex';
  document.getElementById('auth-error').textContent = '';
}
function hideAuth() { document.getElementById('auth-modal').style.display = 'none'; }
function toggleAuthMode() {
  authMode = authMode === 'login' ? 'register' : 'login';
  document.getElementById('auth-title').textContent = authMode === 'login' ? 'Iniciar sesión' : 'Crear cuenta';
  document.getElementById('auth-name').style.display = authMode === 'register' ? 'block' : 'none';
  document.getElementById('auth-switch').textContent = authMode === 'login' ? '¿No tienes cuenta? Regístrate' : '¿Ya tienes cuenta? Inicia sesión';
}
async function doAuth() {
  const name = document.getElementById('auth-name').value.trim();
  const email = document.getElementById('auth-email').value.trim();
  const password = document.getElementById('auth-pass').value;
  const err = document.getElementById('auth-error');
  err.textContent = '';
  if (authMode === 'register' && !name) return err.textContent = 'El nombre es obligatorio';
  if (!email || !password) return err.textContent = 'Correo y contraseña son obligatorios';
  try {
    const url = authMode === 'register' ? '/api/register' : '/api/login';
    const body = authMode === 'register' ? {name, email, password} : {email, password};
    const res = await fetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
    const data = await res.json();
    if (!res.ok) return err.textContent = data.error || 'Error';
    state.token = data.token;
    state.user = data.user;
    state.balance = data.user.balance;
    localStorage.setItem('gaspke-token', data.token);
    localStorage.setItem('gaspke-user', JSON.stringify(data.user));
    hideAuth();
    updateGreeting();
    showToast(authMode === 'register' ? 'Cuenta creada' : 'Sesión iniciada');
    loadUserData();
    showSection('dashboard');
  } catch(e) { err.textContent = 'Error de conexión'; }
}
async function loadUserData() {
  if (!state.token) return;
  try {
    const acc = await fetch('/api/accounts', {headers:{'Authorization':'Bearer '+state.token}}).then(r=>r.json());
    const sales = await fetch('/api/sales', {headers:{'Authorization':'Bearer '+state.token}}).then(r=>r.json());
    state.accounts = acc;
    state.sales = sales;
    saveState();
  } catch(e) {}
}
function logout() {
  state.user = null; state.token = null; state.accounts = []; state.sales = [];
  localStorage.removeItem('gaspke-token');
  localStorage.removeItem('gaspke-user');
  updateGreeting();
  showToast('Sesión cerrada');
  showSection('dashboard');
}

</script>

<div id="auth-modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:9999; align-items:center; justify-content:center;">
  <div style="background:var(--card); padding:28px; border-radius:18px; width:90%; max-width:380px; box-shadow:var(--shadow);">
    <h2 id="auth-title" style="margin-bottom:16px; color:var(--accent);">Iniciar sesión</h2>
    <input id="auth-name" placeholder="Nombre" style="width:100%; padding:12px; margin-bottom:10px; border:1px solid var(--border); border-radius:10px; display:none;">
    <input id="auth-email" type="email" placeholder="Correo electrónico" style="width:100%; padding:12px; margin-bottom:10px; border:1px solid var(--border); border-radius:10px;">
    <input id="auth-pass" type="password" placeholder="Contraseña" style="width:100%; padding:12px; margin-bottom:16px; border:1px solid var(--border); border-radius:10px;">
    <button class="btn" style="width:100%; margin-bottom:10px;" onclick="doAuth()">Continuar</button>
    <p style="text-align:center; font-size:13px; color:var(--text-dim);">
      <span id="auth-switch" onclick="toggleAuthMode()" style="cursor:pointer; color:var(--accent); font-weight:700;">¿No tienes cuenta? Regístrate</span>
    </p>
    <p id="auth-error" style="color:#ef4444; font-size:13px; margin-top:8px; text-align:center;"></p>
  </div>
</div>

</body>
</html>
